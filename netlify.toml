# Near-duplicate of /articles/getting-mortgage-ready/. Article wins.
[[redirects]]
  from = "/landing/getting-mortgage-ready"
  to = "/articles/getting-mortgage-ready/"
  status = 301
  force = true

[[redirects]]
  from = "/landing/getting-mortgage-ready/"
  to = "/articles/getting-mortgage-ready/"
  status = 301
  force = true

# Homepage slash: Netlify treats https://host and https://host/ as the same
# path (/), so a redirect rule cannot 301 one to the other. Pretty URLs
# already 301 inner paths (/page → /page/). Sitemap + canonical use / only.

# ─────────────────────────────────────────────────────────────────────
# HEADERS — security and performance
# ─────────────────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
