# Netlify configuration for Wombat Home Loans
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "_site"
  command = "npm install && npm run build && npx pagefind --site _site"

[functions]
  directory = "netlify/functions"

# Handover waits ~35s after PiFi returns a URL so the report can finish assembling.
[functions.pifi-handover]
  timeout = 90

# ─────────────────────────────────────────────────────────────────────
# REDIRECTS
# ─────────────────────────────────────────────────────────────────────

[[redirects]]
  from = "https://wombatloans.com.au/*"
  to = "https://wombathomeloans.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wombatloans.com.au/*"
  to = "https://wombathomeloans.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://wombatlending.com.au/*"
  to = "https://wombathomeloans.com.au/:splat"
  status = 301
  force = true
  
[[redirects]]
  from = "https://www.wombatlending.com.au/*"
  to = "https://wombathomeloans.com.au/:splat"
  status = 301
  force = true
  
[[redirects]]
  from = "https://wombatfinancial.com.au/*"
  to = "https://wombathomeloans.com.au/:splat"
  status = 301
